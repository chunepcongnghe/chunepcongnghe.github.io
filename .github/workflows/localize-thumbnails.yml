name: Localize unique article thumbnails

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - '.github/scripts/localize_thumbnails.py'
      - '.github/workflows/localize-thumbnails.yml'
      - 'THUMBNAIL-POLICY.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[thumb-localize]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Build and validate local thumbnails
        run: python .github/scripts/localize_thumbnails.py

      - name: Commit localized thumbnails
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No thumbnail changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/images/thumbs
          git commit -m "[thumb-localize] Localize unique article thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
