media:
  - name: post_images
    label: Ảnh bài viết
    input: assets/posts
    output: /assets/posts

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "Đăng bài mới: {filename}"
      update: "Cập nhật bài viết: {filename}"
      delete: "Xóa bài viết: {filename}"
      rename: "Đổi đường dẫn bài viết: {oldFilename} → {newFilename}"

content:
  - name: posts
    label: Bài viết Chú Nếp Công Nghệ
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{fields.slug}.md"
      field: create
    view:
      fields: [title, published, featured, date, section, category, source_status]
      primary: title
      sort: [date, title, section, category]
      search: [title, description, answer_summary, target_query, section, category, tags, brand]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tiêu đề bài viết
        type: string
        required: true
      - name: slug
        label: Đường dẫn bài viết
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Chỉ dùng chữ thường không dấu, số và dấu gạch ngang.
      - name: description
        label: Mô tả SEO
        type: text
        required: true
        description: Khoảng 140–165 ký tự, nêu rõ sản phẩm/vấn đề và lợi ích người đọc nhận được.
      - name: answer_summary
        label: Câu trả lời ngắn AEO/GEO
        type: text
        required: true
        description: 2–4 câu trả lời trực tiếp truy vấn chính trước khi giải thích sâu.
      - name: target_query
        label: Truy vấn trọng tâm
        type: string
        required: true
      - name: key_takeaways
        label: Điểm cần biết ngay
        type: string
        list: true
        required: true
        description: Tối thiểu 3 ý cụ thể, có thể đọc riêng mà vẫn hiểu bài.
      - name: compare_subject
        label: Tên phương án chính trong bảng đối chiếu
        type: string
        required: true
      - name: compare_reference
        label: Tên phương án đối chiếu
        type: string
        required: true
      - name: quick_compare
        label: Bảng đối chiếu nhanh
        type: object
        list: true
        required: true
        description: Mỗi bài tối thiểu 3 tiêu chí so với đời trước, đối thủ, cấu hình khác hoặc phương án thay thế.
        fields:
          - name: criterion
            label: Tiêu chí
            type: string
            required: true
          - name: subject_value
            label: Phương án chính
            type: string
            required: true
          - name: reference_value
            label: Phương án đối chiếu
            type: string
            required: true
          - name: verdict
            label: Ý nghĩa thực tế
            type: text
            required: true
      - name: date
        label: Ngày giờ xuất bản
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
      - name: date_modified
        label: Ngày cập nhật
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
      - name: section
        label: Tuyến nội dung / Trang con
        type: select
        required: true
        options:
          values:
            - name: tin-moi
              label: Tin mới
            - name: tren-tay-danh-gia
              label: Trên tay & Đánh giá
            - name: tu-van-chon-mua
              label: Góc Chọn & Mua
            - name: so-sanh-hieu-suat
              label: So sánh hiệu suất
            - name: thu-thuat
              label: Thủ thuật
            - name: deeptalk
              label: DeepTalk Chú Nếp
            - name: video
              label: Video / YouTube
      - name: section_label
        label: Tên tuyến hiển thị
        type: string
        required: true
      - name: category
        label: Nhóm sản phẩm / Chủ đề
        type: select
        required: true
        options:
          values:
            - name: smartphone
              label: Điện thoại
            - name: laptop
              label: Laptop
            - name: pc-linh-kien
              label: PC & Linh kiện
            - name: ai
              label: AI & Công cụ AI
            - name: camera-creator-gear
              label: Camera / Action Cam / Creator Gear
            - name: wearable
              label: Wearable
            - name: smart-home
              label: Smart Home
            - name: setup
              label: Góc setup
            - name: gaming
              label: Gaming
            - name: phan-mem
              label: Phần mềm / Hệ điều hành
            - name: khac
              label: Khác
      - name: category_label
        label: Tên nhóm hiển thị
        type: string
        required: true
      - name: brand
        label: Thương hiệu
        type: string
        required: false
      - name: tags
        label: Thẻ chủ đề
        type: string
        list: true
      - name: image
        label: Ảnh đại diện
        type: image
        required: true
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp, svg]
          rename: true
      - name: image_alt
        label: Mô tả ảnh
        type: string
        required: true
      - name: source_status
        label: Trạng thái nguồn
        type: select
        required: true
        default: confirmed
        options:
          values:
            - name: confirmed
              label: Đã xác nhận / có nguồn rõ
            - name: vendor-claim
              label: Claim / benchmark của hãng
            - name: leak
              label: Tin rò rỉ / chưa xác nhận
      - name: sources
        label: Nguồn tham khảo & đối chiếu
        type: object
        list: true
        required: true
        fields:
          - name: name
            label: Tên nguồn
            type: string
            required: true
          - name: url
            label: URL nguồn
            type: string
            required: true
      - name: comparison
        label: Dữ liệu so sánh hiệu suất chuyên sâu
        type: object
        required: false
        description: Chỉ dùng thêm cho bài thuộc tuyến So sánh hiệu suất.
        fields:
          - name: product_a
            label: Sản phẩm A
            type: string
            required: true
          - name: product_b
            label: Sản phẩm B
            type: string
            required: true
          - name: test_conditions
            label: Điều kiện / phương pháp test
            type: text
            required: true
          - name: metrics
            label: Chỉ số đối chiếu
            type: object
            list: true
            fields:
              - name: name
                label: Tên chỉ số
                type: string
                required: true
              - name: unit
                label: Đơn vị
                type: string
              - name: product_a_value
                label: Giá trị sản phẩm A
                type: string
                required: true
              - name: product_b_value
                label: Giá trị sản phẩm B
                type: string
                required: true
              - name: source_name
                label: Tên nguồn chỉ số
                type: string
                required: true
              - name: source_url
                label: URL nguồn chỉ số
                type: string
                required: true
          - name: conclusion
            label: Kết luận so sánh
            type: text
      - name: video_url
        label: Video YouTube liên quan
        type: string
      - name: author
        label: Tác giả
        type: string
        required: true
        default: Chú Nếp
      - name: author_role
        label: Vai trò tác giả
        type: string
        required: true
        default: Chú Nếp Công Nghệ
      - name: read_time
        label: Thời gian đọc (phút)
        type: number
        required: true
        default: 7
      - name: featured
        label: Bài nổi bật
        type: boolean
        default: false
      - name: published
        label: Xuất bản
        type: boolean
        default: true
      - name: faq
        label: Câu hỏi thường gặp
        type: object
        list: true
        required: true
        fields:
          - name: question
            label: Câu hỏi
            type: string
            required: true
          - name: answer
            label: Câu trả lời
            type: text
            required: true
      - name: body
        label: Nội dung bài viết
        type: rich-text
        required: true
        options:
          format: markdown
          media: post_images
          extensions: [jpg, jpeg, png, webp, svg]
          rename: true
          switcher: true

  - name: home_settings
    label: Tùy chỉnh trang chủ
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: hero_eyebrow
        label: Nhãn hero
        type: string
      - name: hero_title
        label: Tiêu đề hero
        type: string
      - name: hero_description
        label: Mô tả hero
        type: text
      - name: brand_tagline
        label: Tagline thương hiệu
        type: string
      - name: featured_topics
        label: Chủ đề nổi bật
        type: string
        list: true
      - name: quick_topics
        label: Lối tắt chuyên mục
        type: object
        list: true
        fields:
          - name: label
            label: Nhãn
            type: string
          - name: url
            label: URL
            type: string
